<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/updateForm.css">
	<script src="/updateForm.js" defer></script>
    <title>社員情報更新画面</title>
</head>
<body>
	
	<div class="header">
	  <header>
		<h2><span style="color: red;">社員情報更新(入力)</span></h2>
		<div class="LoginDateTime">
			<p th:text="${LoginDateTime}"></p>
		</div>
	  </header>
	</div>
	
   <div class="wrapper">
	
    <form action="/updateCheck" method="post" id="updateForm" th:attr="DataErrorMessage=${errorMessage}">
      <div class="rist">
		<p style="color: red;">＊は入力必須項目です</p>
        <div class="item">
			<div class="formTitle">
            <label for="id">社員ID</label>
			</div>
			<div class="inputForm">
            <input type="text" pattern="^[0-9]+$" id="id" name="id" th:value="${id}" style="background-color: lightgray" readonly>
			<input type="hidden" id="errorMessage" th:value="${IdError} ?: ${error}">
			<p class="errorMsg" th:if="${IdEmptyError}" th:text="${IdEmptyError}" style="color: red;"></p>
			<p class="errorMsg" th:if="${IdError}" th:text="${IdError}" style="color: red;"></p>
			</div>
        </div> 
		
        <div class="item">
			<div class="formTitle">
            <label for="name">社員名<span style="color: red;">＊</span></label>
			</div>
			<div class="inputForm">
            <input type="text" id="name" name="name" th:value="${name}">
			<p class="errorMsg" th:if="${NameEmptyError}" th:text="${NameEmptyError}" style="color: red;"></p>
			<p class="errorMsg" th:if="${NameError}" th:text="${NameError}" style="color: red;"></p>
			</div>
        </div>
		
        <div class="item">
			<div class="formTitle">
            <label for="age">年齢<span style="color: red;">＊</span></label>
			<p class="rule">※数値のみ入力可能</p>
			</div>
			<div class="inputForm">
            <input type="text" pattern="^[0-9]+$" minlength="2" maxlength="3" id="age" name="age" th:attr="value=${age}">
			  <p class="errorMsg" th:if="${AgeEmptyError}" th:text="${AgeEmptyError}" style="color: red;"></p>
			  <p class="errorMsg" th:if="${AgeError}" th:text="${AgeError}" style="color: red;"></p>
			</div>  	
        </div>
		
        <div class="item"> 
			<div class="formTitle">
            <label for="password">パスワード<span style="color: red;">＊</span></label>
			<p class="rule">※半角英数字のみ(両方使用必須)</p>
			</div>
			<div class="inputForm">
            <input type="password" pattern="^[a-zA-Z0-9]+$" minlength="8" id="password" name="password" th:value="${password}">
			<p class="errorMsg" th:if="${PwEmptyError}" th:text="${PwEmptyError}" style="color: red;"></p>
			<p class="errorMsg" th:if="${PwError}" th:text="${PwError}" style="color: red;"></p>
			</div>
        </div>
		
        <div class="item">
			<div class="formTitle">
            <label for="passwordCheck">パスワード確認</label>
			</div>
			<div class="inputForm">
            <input type="password" pattern="^[a-zA-Z0-9]+$" minlength="8" id="passwordCheck" name="passwordCheck" th:value="${passwordCheck}">
			<p class="errorMsg"th:if="${PwcError}" th:text="${PwcError}" style="color: red;"></p>
			</div>
        </div> 
		
        <div class="item">
			<div class="formTitle">
            <label for="start_date">開始日<span style="color: red;">＊</span></label>
			</div>
			<div class="inputForm">
            <input type="date" id="start_date" name="start_date" th:value="${start_date}">
			<p class="errorMsg" th:if="${SdEmptyError}" th:text="${SdEmptyError}" style="color: red;"></p>
			<p class="errorMsg" th:if="${SdError}" th:text="${SdError}" style="color: red;"></p>
			</div>
        </div> 
		
        <div class="item">
			<div class="formTitle">
            <label for="end_date">終了日</label>
			</div>
			<div class="inputForm">
            <input type="date" id="end_date" name="end_date" th:value="${end_date}">
			<p class="errorMsg" th:if="${EdEmptyError}" th:text="${EdEmptyError}" style="color: red;"></p>
			<p class="errorMsg" th:if="${EdError}" th:text="${EdError}" style="color: red;"></p>
			</div>
        </div>  
      </div>
	</form>   
 
	  <div class="button">
	  		<button class="check" type="submit" form="updateForm">確認</button>
	  	    <button class="delete" type="button" onclick="formReset()">削除</button>
		<form action="/idSearch" method="post">	 
			<input type="hidden" name="id" th:value="${id}">  
	  	    <button class="back" type="submit" name="back_button" value="back">戻る</button>
		</form>	   
	   </div>

   </div> 
   
   <footer>
	<p>Copyright &copy; 2022</p>
   </footer>
    
</body>
</html>
