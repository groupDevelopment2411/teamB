<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>社員情報登録</title>
    <link rel="stylesheet" href="/insertFormb.css">
    <script src="/insertFormb.js" defer></script>
</head>
<body>
    <div class="employee">社員情報登録　(入力）</div>
    <div class="wrapper">
    <form action="/confirm" method="post">
        <div class="form-group">
            <label for="name" class="required">社員名:</label> 
            <input type="text" name="name" th:value="${name}" required>
        </div>

        <div class="form-group">
            <label for="age" class="required">年齢:</label>
            <input type="number" name="age" th:value="${age}" required>
        </div>

        <div class="form-group">
            <label for="password" class="required">パスワード:</label>
            <input type="password" name="password" th:value="${password}" required>
        </div>

        <div class="form-group">
            <label for="password2" class="required">パスワード確認:</label>
            <input type="password" name="password2" th:value="${password2}" required>
        </div>
 	</div>
       
    </div>
        
        <!-- エラーメッセージを表示する場所 -->
        <p id="errorMessage" style="color: red;">
            <span th:text="${errorMessage}"></span>
        </p>
          
        
		<div class="footer">
  	<div class="line"></div>
  	<p class="copyright">Copyright &copy; 2022</p>
		</div>
		
		<div class="button-container">
   		 <input type="submit" value="確認">

    		<!-- 戻るボタン -->
    		<form action="/goBack" method="post">
        <button type="submit">戻る</button>
    	</form>
</div>
